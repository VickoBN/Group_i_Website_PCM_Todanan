{% extends 'base.html' %}
{% block title %}Halaman tidak ditemukan{% endblock %}
{% block content %}
<style>
  .halaman-404 { display: grid; justify-items: center; text-align: center; padding: 32px 0; color: var(--hijau); }
  .halaman-404 .face { display: block; width: 12em; height: auto; }
  .halaman-404 p { color: var(--teks); }

  .halaman-404 .face__eyes,
  .halaman-404 .face__eye-lid,
  .halaman-404 .face__mouth-left,
  .halaman-404 .face__mouth-right,
  .halaman-404 .face__nose,
  .halaman-404 .face__pupil {
    animation: eyes 1s 0.3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
  }
  .halaman-404 .face__eye-lid,
  .halaman-404 .face__pupil {
    animation-duration: 4s;
    animation-delay: 1.3s;
    animation-iteration-count: infinite;
  }
  .halaman-404 .face__eye-lid { animation-name: eye-lid; }
  .halaman-404 .face__mouth-left,
  .halaman-404 .face__mouth-right { animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1); }
  .halaman-404 .face__mouth-left { animation-name: mouth-left; }
  .halaman-404 .face__mouth-right { animation-name: mouth-right; }
  .halaman-404 .face__nose { animation-name: nose; }
  .halaman-404 .face__pupil { animation-name: pupil; }

  @keyframes eye-lid {
    from, 40%, 45%, to { transform: translateY(0); }
    42.5% { transform: translateY(17.5px); }
  }
  @keyframes eyes {
    from { transform: translateY(112.5px); }
    to { transform: translateY(15px); }
  }
  @keyframes pupil {
    from, 37.5%, 40%, 45%, 87.5%, to { stroke-dashoffset: 0; transform: translate(0, 0); }
    12.5%, 25%, 62.5%, 75% { stroke-dashoffset: 0; transform: translate(-35px, 0); }
    42.5% { stroke-dashoffset: 35; transform: translate(0, 17.5px); }
  }
  @keyframes mouth-left {
    from, 50% { stroke-dashoffset: -102; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes mouth-right {
    from, 50% { stroke-dashoffset: 102; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes nose {
    from { transform: translate(0, 0); }
    to { transform: translate(0, 22.5px); }
  }
</style>

<section class="halaman-404">
  <svg class="face" viewBox="0 0 320 380" width="320" height="380" aria-label="Angka 404 berubah menjadi wajah yang melirik ke samping dan berkedip.">
    <g fill="none" stroke="currentcolor" stroke-linecap="round" stroke-linejoin="round" stroke-width="25">
      <g class="face__eyes" transform="translate(0, 112.5)">
        <g transform="translate(15, 0)">
          <polyline class="face__eye-lid" points="37,0 0,120 75,120" />
          <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35" />
        </g>
        <g transform="translate(230, 0)">
          <polyline class="face__eye-lid" points="37,0 0,120 75,120" />
          <polyline class="face__pupil" points="55,120 55,155" stroke-dasharray="35 35" />
        </g>
      </g>
      <rect class="face__nose" rx="4" ry="4" x="132.5" y="112.5" width="55" height="155" />
      <g stroke-dasharray="102 102" transform="translate(65, 334)">
        <path class="face__mouth-left" d="M 0 30 C 0 30 40 0 95 0" stroke-dashoffset="-102" />
        <path class="face__mouth-right" d="M 95 0 C 150 0 190 30 190 30" stroke-dashoffset="102" />
      </g>
    </g>
  </svg>

  <h1>Halaman tidak ditemukan</h1>
  <p>Alamat yang kamu buka tidak ada atau sudah dipindahkan.</p>
  <p><a class="tombol" href="{% url 'pcm_app:beranda' %}">Kembali ke beranda</a></p>
</section>
{% endblock %}
